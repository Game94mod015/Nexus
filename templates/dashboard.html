<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Railway Panel</title>
<style>
:root{--bg:#090b12;--card:#111522;--line:#242a3a;--text:#eef2ff;--muted:#8f98ad;--accent:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17122d,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
h1{margin:0}.badge{padding:8px 12px;border:1px solid #343b50;border-radius:999px;color:#aeb8d0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(17,21,34,.82);border:1px solid var(--line);border-radius:18px;padding:20px;backdrop-filter:blur(14px);box-shadow:0 15px 50px #0005}
.metric b{display:block;font-size:28px;margin-top:8px}.muted{color:var(--muted);font-size:13px}
.panel{margin-top:18px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
button,input{border:1px solid var(--line);background:#0d111d;color:var(--text);border-radius:10px;padding:10px 12px}button{background:var(--accent);border:0;cursor:pointer}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Nexus Railway Panel</h1><span class="badge">● System Online</span></div>
  <div class="grid">
    <div class="card metric"><span class="muted">Users</span><b>{{ users|length }}</b></div>
    <div class="card metric"><span class="muted">Nodes</span><b>0</b></div>
    <div class="card metric"><span class="muted">CPU</span><b id="cpu">—</b></div>
    <div class="card metric"><span class="muted">RAM</span><b id="ram">—</b></div>
  </div>
  <div class="card panel">
    <h2>Users</h2>
    {% for u in users %}
    <div class="row">
      <div><strong>{{u.name}}</strong><div class="muted">{{u.subscription_path}}</div></div>
      <button onclick="navigator.clipboard.writeText(location.origin+'{{u.subscription_path}}')">Copy Subscription</button>
    </div>
    {% else %}<div class="muted">No users yet.</div>{% endfor %}
  </div>
</div>
</body>
</html>
